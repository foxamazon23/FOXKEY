  dimensions and wearing the FoxKey HGV decals. Rendered to a still image by scripts/generate-assets.mjs (npm run assets).
  Query: ?w=&h= output size, cam=x,y,z, look=x,y,z, fov=degrees.
  Coordinates in metres: x runs from the front bumper line (0) to the rear (5.93), y up from the ground, z across
  (+z is the nearside, the side with the sliding door, facing the camera).
-->

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { FOX_HEAD, FOX_BLADE } from '/src/brand/fox.mjs';

const q = new URLSearchParams(location.search);
const OUT_W = +(q.get('w') || 2400), OUT_H = +(q.get('h') || 1200);
const CAM = (q.get('cam') || '-3.7,1.4,8.4').split(',').map(Number);
const LOOK = (q.get('look') || '2.7,1.2,0').split(',').map(Number);
const FOV = +(q.get('fov') || 24);

await document.fonts.load('900 100px Overpass');
await document.fonts.load('800 100px Overpass');

const BLUE = '#0B4EA2', YELLOW = '#FFD500', INK = '#0B0C0C', LIGHT = '#DCE7F5', BAND = '#1F4FA6';
const { lerp, clamp, smoothstep } = THREE.MathUtils;

// ---------------------------------------------------------------- renderer, scene
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(OUT_W, OUT_H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.9;

// ---------------------------------------------------------------- materials
const paint = new THREE.MeshPhysicalMaterial({ color: 0xe4e6e7, roughness: 0.27, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05 });
const plastic = new THREE.MeshStandardMaterial({ color: 0x24282c, roughness: 0.7 });
const plasticGloss = new THREE.MeshPhysicalMaterial({ color: 0x111417, roughness: 0.22, clearcoat: 0.7 });
const satin = new THREE.MeshStandardMaterial({ color: 0xc9ced3, roughness: 0.28, metalness: 0.9 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xe8ecef, roughness: 0.08, metalness: 1 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x0b1117, roughness: 0.03, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.5 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x17181a, roughness: 0.9 });
const steel = new THREE.MeshStandardMaterial({ color: 0xb5bbc0, roughness: 0.32, metalness: 0.85 });
const steelTrim = new THREE.MeshStandardMaterial({ color: 0xc3c8cd, roughness: 0.3, metalness: 0.8, side: THREE.DoubleSide });
const amber = new THREE.MeshPhysicalMaterial({ color: 0xf0a020, roughness: 0.15, clearcoat: 1 });
const seamMat = new THREE.MeshStandardMaterial({ color: 0x4e555b, roughness: 0.6 });

const add = (geo, mat, x = 0, y = 0, z = 0, o = {}) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  m.castShadow = o.cast !== false;
  m.receiveShadow = true;
  scene.add(m);
  return m;
};

// ---------------------------------------------------------------- body: lofted cross-sections
const L = 5.93, HW = 0.995, FX = 1.0, RX = 4.665, WR = 0.355, AR = 0.445, AXLE_Y = 0.36;
const RN_PLAN = 0.2, RN_VERT = 0.06, R_REAR = 0.08;

function topY(x) {
  if (x < 0.32) return lerp(1.13, 1.17, smoothstep(x, 0, 0.32));
  if (x < 1.1) { const t = (x - 0.32) / 0.78; return 1.17 + 0.28 * Math.pow(t, 1.15); }
  if (x < 1.64) return 1.45 + (x - 1.1) * (0.91 / 0.54);
  if (x < 2.1) return 2.36 + 0.32 * Math.sin(((x - 1.64) / 0.46) * Math.PI / 2);
  return 2.68;
}
function botY(x) {
  let y = 0.42;
  for (const wx of [FX, RX]) { const dx = x - wx; if (Math.abs(dx) < AR) y = Math.max(y, AXLE_Y + Math.sqrt(AR * AR - dx * dx)); }
  return y;
}
function prof(x) {
  let yt = topY(x), yb = botY(x);
  let hwB = HW - 0.05 * Math.pow(1 - smoothstep(x, 0, 1.25), 1.5);
  let hwT;
  if (x < 1.1) hwT = hwB - 0.02;
  else hwT = lerp(hwB - 0.02, HW - 0.07, smoothstep(x, 1.1, 1.7));
  let rt = x < 1.1 ? 0.18 : x < 1.7 ? lerp(0.18, 0.1, smoothstep(x, 1.1, 1.3)) : lerp(0.1, 0.16, smoothstep(x, 1.7, 2.2));
  const rb = 0.05;
  // rounded ends: inset the section towards the bumper line and the rear doors
  if (x < RN_PLAN) { const d = RN_PLAN - Math.sqrt(Math.max(0, RN_PLAN * RN_PLAN - (RN_PLAN - x) ** 2)); hwB -= d; hwT -= d; }
  if (x < RN_VERT) { const d = RN_VERT - Math.sqrt(Math.max(0, RN_VERT * RN_VERT - (RN_VERT - x) ** 2)); yt -= d; yb += d; }
  if (x > L - R_REAR) { const u = x - (L - R_REAR); const d = R_REAR - Math.sqrt(Math.max(0, R_REAR * R_REAR - u * u)); hwB -= d; hwT -= d; yt -= d; yb += d; }
  rt = Math.min(rt, hwT * 0.9, (yt - yb) * 0.4);
  return { yt, yb, hwB, hwT, rt, rb, bulge: 0.016 };
}
// outward offset on the flanks: wheel-arch flares and the horizontal swage line
function disp(x, y) {
  let d = 0;
  for (const wx of [FX, RX]) {
    const r = Math.hypot(x - wx, y - AXLE_Y);
    const t = (r - AR + 0.01) / 0.17;
    if (t > 0 && t < 1 && y > 0.4) d += 0.024 * Math.pow(Math.sin(Math.PI * t), 0.8) * (t < 0.15 ? t / 0.15 : 1);
  }
  const along = smoothstep(x, 0.9, 1.3) * (1 - smoothstep(x, 5.6, 5.85));
  d += 0.01 * (1 - smoothstep(y, 0.865, 0.9)) * along * smoothstep(y, 0.45, 0.6);
  return d;
}
const SEG = { bot: 6, arcB: 8, side: 34, arcT: 14, top: 10 };
function halfRing(x) {
  const p = prof(x), pts = [];
  for (let i = 0; i < SEG.bot; i++) pts.push([lerp(0, p.hwB - p.rb, i / SEG.bot), p.yb]);
  for (let i = 0; i < SEG.arcB; i++) { const a = -Math.PI / 2 + (i / SEG.arcB) * Math.PI / 2; pts.push([p.hwB - p.rb + p.rb * Math.cos(a), p.yb + p.rb + p.rb * Math.sin(a)]); }
  const y0 = p.yb + p.rb, y1 = p.yt - p.rt;
  for (let i = 0; i < SEG.side; i++) { const t = i / SEG.side; pts.push([lerp(p.hwB, p.hwT, t) + p.bulge * Math.sin(Math.PI * t), lerp(y0, y1, t)]); }
  for (let i = 0; i < SEG.arcT; i++) { const a = (i / SEG.arcT) * Math.PI / 2; pts.push([p.hwT - p.rt + p.rt * Math.cos(a), y1 + p.rt * Math.sin(a)]); }
  for (let i = 0; i <= SEG.top; i++) pts.push([lerp(p.hwT - p.rt, 0, i / SEG.top), p.yt]);
  return pts.map(([z, y]) => { const w = clamp((z - 0.6) / 0.2, 0, 1); return [z + disp(x, y) * w, y]; });
}
function fullRing(x) {
  const h = halfRing(x);                       // from bottom centre round to top centre (z >= 0)
  const mirrored = h.slice(1, -1).reverse().map(([z, y]) => [-z, y]);
  return h.concat(mirrored);                   // closed loop
}
// side surface z at (x, y), for laying decals, windows and trim onto the flank
function sideZ(x, y) {
  const p = prof(x), y0 = p.yb + p.rb, y1 = p.yt - p.rt, t = clamp((y - y0) / (y1 - y0), 0, 1);
  return lerp(p.hwB, p.hwT, t) + p.bulge * Math.sin(Math.PI * t) + disp(x, y);
}

const xs = [];
for (let i = 0; i <= 24; i++) xs.push(RN_PLAN * (1 - Math.cos((i / 24) * Math.PI / 2)));
for (let x = 0.21; x < L - R_REAR; x += (Math.abs(x - FX) < 0.55 || Math.abs(x - RX) < 0.55 || x < 1.8) ? 0.012 : 0.03) xs.push(x);
for (let i = 0; i <= 12; i++) xs.push(L - R_REAR + R_REAR * Math.sin((i / 12) * Math.PI / 2));

function loft(x0, x1) {
  const sel = xs.filter((x) => x >= x0 - 1e-9 && x <= x1 + 1e-9);
  const rings = sel.map(fullRing), n = rings[0].length, pos = [], idx = [];
  sel.forEach((x, i) => rings[i].forEach(([z, y]) => pos.push(x, y, z)));
  for (let i = 0; i < sel.length - 1; i++) for (let j = 0; j < n; j++) {
    const a = i * n + j, b = i * n + ((j + 1) % n), c = (i + 1) * n + j, d = (i + 1) * n + ((j + 1) % n);
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function cap(x, facing) {
  const ring = fullRing(x);
  const shape = new THREE.Shape(ring.map(([z, y]) => new THREE.Vector2(z, y)));
  const g = new THREE.ShapeGeometry(shape);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const z = p.getX(i), y = p.getY(i); p.setXYZ(i, x, y, z); }
  g.computeVertexNormals();
  const m = new THREE.MeshPhysicalMaterial().copy(paint); m.side = THREE.DoubleSide;
  return add(g, m, 0, 0, 0);
}
const nose = add(loft(0, 0.8), paint);
add(loft(0.8, L), paint);
const frontCap = cap(0, -1);
cap(L, 1);
scene.updateMatrixWorld(true);

// underbody, arch liners
add(new THREE.BoxGeometry(5.0, 0.16, 1.7), plastic, 3.0, 0.36, 0);
for (const wx of [FX, RX]) add(new THREE.BoxGeometry(0.92, 0.44, 1.86), plastic, wx, 0.62, 0, { cast: false });

// ---------------------------------------------------------------- helpers to lay geometry on the flank
const subdivide = (geo, levels) => {                // split every triangle into four, so draped shapes follow the curved flank
  let g = geo.index ? geo.toNonIndexed() : geo;
  for (let l = 0; l < levels; l++) {
    const a = g.attributes.position.array, out = [];
    for (let i = 0; i < a.length; i += 9) {
      const A = a.slice(i, i + 3), B = a.slice(i + 3, i + 6), C = a.slice(i + 6, i + 9);
      const m = (P, Q) => [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2, (P[2] + Q[2]) / 2];
      const AB = m(A, B), BC = m(B, C), CA = m(C, A);
      out.push(...A, ...AB, ...CA, ...AB, ...B, ...BC, ...CA, ...BC, ...C, ...AB, ...BC, ...CA);
    }
    g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
  }
  return g;
};
const sideSurface = (pts2d, off) => {               // a flat polygon (x, y) draped onto the +z flank
  const shape = new THREE.Shape(pts2d.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = subdivide(new THREE.ShapeGeometry(shape, 24), 4);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, sideZ(x, y) + off); }
  g.computeVertexNormals();
  return g;
};
const sideGrid = (x0, x1, y0, y1, nx, ny, off) => {   // UV-mapped grid on the +z flank (for decals)
  const g = new THREE.PlaneGeometry(x1 - x0, y1 - y0, nx, ny);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i) + (x0 + x1) / 2, y = p.getY(i) + (y0 + y1) / 2; p.setXYZ(i, x, y, sideZ(x, y) + off); }
  g.computeVertexNormals();
  return g;
};
const sideLine = (pts, width = 0.005, mat = seamMat, off = 0.0015) => {   // a thin ribbon along a polyline on the flank
  const dense = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], n = Math.max(2, Math.ceil(Math.hypot(bx - ax, by - ay) / 0.03));
    for (let k = 0; k < n; k++) dense.push([lerp(ax, bx, k / n), lerp(ay, by, k / n)]);
  }
  dense.push(pts[pts.length - 1]);
  const pos = [], idx = [];
  dense.forEach(([x, y], i) => {
    const [px, py] = dense[Math.max(0, i - 1)], [nx, ny] = dense[Math.min(dense.length - 1, i + 1)];
    let tx = nx - px, ty = ny - py; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const ox = -ty * width / 2, oy = tx * width / 2;
    for (const s of [-1, 1]) { const X = x + s * ox, Y = y + s * oy; pos.push(X, Y, sideZ(X, Y) + off); }
    if (i < dense.length - 1) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return add(g, mat, 0, 0, 0, { cast: false });
};

// ---------------------------------------------------------------- glass
{ // windscreen with a black ceramic border
  const nx = 24, nz = 40, pos = [], uv = [], idx = [];
  const n = new THREE.Vector3(-0.91 / 0.54, 1, 0).normalize();
  for (let i = 0; i <= nx; i++) {
    const x = lerp(1.115, 1.625, i / nx), y = topY(x), p = prof(x), zw = p.hwT - p.rt + 0.03;
    for (let j = 0; j <= nz; j++) {
      const z = lerp(-zw, zw, j / nz);
      pos.push(x + n.x * 0.004, y + n.y * 0.004, z); uv.push(j / nz, i / nx);
    }
  }
  for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) { const a = i * (nz + 1) + j, b = a + 1, c = a + nz + 1, d = c + 1; idx.push(a, b, c, b, d, c); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  add(g, glass, 0, 0, 0, { cast: false });
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const x = c.getContext('2d'); x.fillStyle = '#0a0c0e'; x.fillRect(0, 0, 512, 256);
  x.clearRect(26, 18, 460, 210);
  const frit = new THREE.CanvasTexture(c); frit.colorSpace = THREE.SRGBColorSpace;
  const fg = g.clone(); const fp = fg.attributes.position;
  for (let i = 0; i < fp.count; i++) fp.setXYZ(i, fp.getX(i) + n.x * 0.001, fp.getY(i) + n.y * 0.001, fp.getZ(i));
  add(fg, new THREE.MeshPhysicalMaterial({ map: frit, transparent: true, roughness: 0.1, clearcoat: 1 }), 0, 0, 0, { cast: false });
  // wipers parked at the base of the screen
  for (const [z0, z1] of [[-0.86, -0.08], [-0.02, 0.62]]) {
    const len = z1 - z0, w = add(new RoundedBoxGeometry(0.02, 0.016, len, 2, 0.006), plastic, 1.15, topY(1.15) + 0.02, (z0 + z1) / 2, { cast: false });
    w.rotation.z = Math.atan(0.91 / 0.54) - Math.PI / 2;
  }
}
// cab side window: black frame, then glass, with the small fixed quarter at the front
const winOutline = [[1.47, 1.5], [1.45, 1.74], [1.81, 2.31], [1.86, 2.36], [2.37, 2.36], [2.41, 2.32], [2.41, 1.54], [2.37, 1.5]];
const frameOutline = [[1.3, 1.47], [1.83, 2.4], [2.44, 2.4], [2.44, 1.47]];
add(sideSurface(frameOutline, 0.0012), plasticGloss, 0, 0, 0, { cast: false });
add(sideSurface(winOutline, 0.0025), glass, 0, 0, 0, { cast: false });
add(sideSurface([[1.33, 1.5], [1.43, 1.5], [1.42, 1.69]], 0.0025), glass, 0, 0, 0, { cast: false });

// ---------------------------------------------------------------- shut lines, handles, trims on the nearside
sideLine([[1.48, 0.47], [1.48, 1.36], [1.31, 1.46], [1.82, 2.42], [2.47, 2.43], [2.47, 0.47]]);   // cab door
sideLine([[2.57, 0.47], [2.57, 2.43], [4.17, 2.43], [4.17, 0.47]]);                                // sliding door
sideLine([[4.17, 1.47], [5.83, 1.47]], 0.022, plastic, 0.002);                                     // slider rail cover
sideLine([[5.84, 0.47], [5.84, 2.47]]);                                                            // rear door edge
sideLine([[0.12, 1.04], [0.62, 1.06]], 0.004);                                                     // bonnet / wing
for (const hx of [2.3, 2.7]) {
  const h = add(new RoundedBoxGeometry(0.17, 0.045, 0.035, 3, 0.014), plastic, hx, 1.42, sideZ(hx, 1.42) + 0.012);
}
add(new RoundedBoxGeometry(0.075, 0.03, 0.02, 2, 0.01), amber, 0.86, 1.02, sideZ(0.86, 1.02) + 0.006, { cast: false });
for (const [x0, x1] of [[1.5, 4.18], [5.15, 5.9]]) {
  const strip = sideLine([[x0, 0.67], [x1, 0.67]], 0.085, plastic, 0.006);
}

// ---------------------------------------------------------------- front end
{ // grille with three bars and the star
  const s = new THREE.Shape();
  const r = 0.05, yb = 0.62, ytp = 1.04, bw = 0.43, tw = 0.5;
  s.moveTo(-bw + r, yb); s.lineTo(bw - r, yb); s.quadraticCurveTo(bw, yb, bw + 0.005, yb + r);
  s.lineTo(tw, ytp - r); s.quadraticCurveTo(tw, ytp, tw - r, ytp); s.lineTo(-tw + r, ytp); s.quadraticCurveTo(-tw, ytp, -tw, ytp - r);
  s.lineTo(-bw - 0.005, yb + r); s.quadraticCurveTo(-bw, yb, -bw + r, yb);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 3 });
  g.rotateY(-Math.PI / 2);
  add(g, plasticGloss, 0.045, 0, 0);
  for (const [y, hw] of [[0.72, 0.43], [0.84, 0.455], [0.96, 0.475]]) add(new RoundedBoxGeometry(0.035, 0.055, hw * 2, 3, 0.018), satin, -0.04, y, 0);
  // star in a ring
  const ring = new THREE.TorusGeometry(0.1, 0.013, 16, 96); ring.rotateY(Math.PI / 2);
  add(new THREE.CircleGeometry(0.1, 64).rotateY(-Math.PI / 2), plasticGloss, -0.052, 0.84, 0);
  add(ring, chrome, -0.064, 0.84, 0);
  const st = new THREE.Shape(), R = 0.092, ri = 0.016;
  for (let k = 0; k < 6; k++) { const a = Math.PI / 2 + k * Math.PI / 3, rr = k % 2 === 0 ? R : ri; const px = Math.cos(a) * rr, py = Math.sin(a) * rr; k === 0 ? st.moveTo(px, py) : st.lineTo(px, py); }
  st.closePath();
  const sg = new THREE.ExtrudeGeometry(st, { depth: 0.008, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.003, bevelSegments: 2 });
  sg.rotateY(-Math.PI / 2);
  add(sg, chrome, -0.058, 0.84, 0);
}
{ // wrap-around black bumper with fog lamps and lower intake
  const s = new THREE.Shape();
  s.moveTo(0.64, 1.0); s.lineTo(0.32, 1.005); s.quadraticCurveTo(-0.06, 1.0, -0.065, 0.66); s.lineTo(-0.065, -0.66);
  s.quadraticCurveTo(-0.06, -1.0, 0.32, -1.005); s.lineTo(0.64, -1.0); s.lineTo(0.64, -0.86); s.lineTo(0.3, -0.86);
  s.quadraticCurveTo(0.08, -0.86, 0.08, -0.6); s.lineTo(0.08, 0.6); s.quadraticCurveTo(0.08, 0.86, 0.3, 0.86); s.lineTo(0.64, 0.86);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.28, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.03, bevelSegments: 5, curveSegments: 24 });
  g.rotateX(Math.PI / 2);
  add(g, plastic, 0, 0.62, 0);
  add(new RoundedBoxGeometry(0.03, 0.09, 1.0, 3, 0.03), plasticGloss, -0.09, 0.42, 0, { cast: false });
  for (const side of [1, -1]) {
    const fr = new THREE.TorusGeometry(0.052, 0.01, 12, 48); fr.rotateY(Math.PI / 2);
    add(fr, satin, -0.1, 0.43, side * 0.7, { cast: false });
    add(new THREE.CircleGeometry(0.05, 40).rotateY(-Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: 0xd8dde2, metalness: 0.6, roughness: 0.08, clearcoat: 1 }), -0.096, 0.43, side * 0.7, { cast: false });
  }
  // front number plate
  const c = document.createElement('canvas'); c.width = 1040; c.height = 222;
  const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 1040, 222);
  x.fillStyle = '#111'; x.font = '900 168px Overpass'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('FK16 HGV', 520, 122);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  add(new THREE.PlaneGeometry(0.52, 0.111), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4 }), -0.103, 0.555, 0, { ry: -Math.PI / 2, cast: false });
}
{ // headlights: swept teardrop units draped over the front corners
  const ray = new THREE.Raycaster(), targets = [nose, frontCap];
  const zc = (HW - 0.05) - RN_PLAN, arc = (Math.PI / 2) * RN_PLAN;
  const U0 = -0.25, U1 = arc + 0.36, NU = 70, NV = 12;
  const yTop = (u) => { const x = u > arc ? RN_PLAN + (u - arc) : u > 0 ? RN_PLAN * (1 - Math.cos(u / RN_PLAN)) : 0; return Math.min(topY(x) - 0.045, 1.05 + 0.07 * smoothstep(u, 0, U1)); };
  const yBot = (u) => lerp(0.83, yTop(U1) - 0.015, smoothstep(u, arc * 0.6, U1));
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const x = c.getContext('2d');
  const bg = x.createLinearGradient(0, 0, 0, 256); bg.addColorStop(0, '#c5cdd4'); bg.addColorStop(0.5, '#6f7a84'); bg.addColorStop(1, '#a9b2ba');
  x.fillStyle = bg; x.fillRect(0, 0, 1024, 256);
  x.fillStyle = '#15191d'; x.fillRect(0, 0, 1024, 16); x.fillRect(0, 240, 1024, 16); x.fillRect(1004, 0, 20, 256);
  x.fillStyle = '#272d34'; x.fillRect(40, 64, 940, 130);
  for (const [cx, r] of [[160, 74], [340, 66]]) {
    const g = x.createRadialGradient(cx, 129, 4, cx, 129, r); g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, '#e3e9ee'); g.addColorStop(0.68, '#8a959e'); g.addColorStop(1, '#15191d');
    x.fillStyle = g; x.beginPath(); x.arc(cx, 129, r, 0, Math.PI * 2); x.fill();
  }
  x.fillStyle = '#f4f7f9'; x.fillRect(30, 30, 960, 16);
  x.fillStyle = '#f1a020'; x.fillRect(600, 100, 300, 58);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.08, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.02 });
  for (const side of [1, -1]) {
    const pos = [], uv = [], idx = [];
    for (let i = 0; i <= NU; i++) {
      const u = lerp(U0, U1, i / NU), yt = yTop(u), yb = yBot(u);
      for (let j = 0; j <= NV; j++) {
        const y = lerp(yb, yt, j / NV);
        let o, d;
        if (u < 0) { o = new THREE.Vector3(-1, y, zc + u); d = new THREE.Vector3(1, 0, 0); }
        else if (u < arc) { const a = u / RN_PLAN; o = new THREE.Vector3(RN_PLAN - Math.cos(a), y, zc + Math.sin(a)); d = new THREE.Vector3(Math.cos(a), 0, -Math.sin(a)); }
        else { o = new THREE.Vector3(RN_PLAN + (u - arc), y, 2); d = new THREE.Vector3(0, 0, -1); }
        if (side < 0) { o.z *= -1; d.z *= -1; }
        ray.set(o, d);
        const hit = ray.intersectObjects(targets, false)[0];
        const p = hit ? hit.point.clone().addScaledVector(d, -0.005) : o.clone();
        pos.push(p.x, p.y, p.z); uv.push(i / NU, j / NV);
      }
    }
    for (let i = 0; i < NU; i++) for (let j = 0; j < NV; j++) { const a = i * (NV + 1) + j, b = a + 1, cc = a + NV + 1, d = cc + 1; side > 0 ? idx.push(a, cc, b, b, cc, d) : idx.push(a, b, cc, b, d, cc); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    const m = add(g, mat, 0, 0, 0, { cast: false });
    m.material.side = THREE.DoubleSide;
  }
}
// mirrors (large upper glass, small wide-angle lower glass) on arms from the door
for (const side of [1, -1]) {

for (const side of [1, -1]) add(new RoundedBoxGeometry(0.05, 0.62, 0.13, 3, 0.02), new THREE.MeshPhysicalMaterial({ color: 0xa3141a, roughness: 0.12, clearcoat: 1 }), L - 0.005, 0.98, side * (HW - 0.1));

// ---------------------------------------------------------------- wheels: 16" steel wheels with full trims, 235/65 R16 C tyres
const tyreProfile = [[0.215, -0.118], [0.318, -0.118], [0.345, -0.104], [0.355, -0.07], [0.357, 0], [0.355, 0.07], [0.345, 0.104], [0.318, 0.118], [0.215, 0.118]].map(([r, y]) => new THREE.Vector2(r, y));
const tyreGeo = new THREE.LatheGeometry(tyreProfile, 96);
const trimProfile = [[0, 0.12], [0.06, 0.122], [0.12, 0.118], [0.17, 0.108], [0.205, 0.094], [0.215, 0.08], [0.215, 0.06]].map(([r, y]) => new THREE.Vector2(r, y));

for (const wx of [FX, RX]) for (const side of [1, -1]) {

  }
  add(new THREE.CylinderGeometry(0.045, 0.05, 0.012, 32), plastic, wx, WR, z + side * 0.124, { rx: Math.PI / 2, cast: false });
}

// ---------------------------------------------------------------- livery
const fox = (ctx, x, y, w, fill) => { ctx.save(); ctx.translate(x, y); ctx.scale(w / 64, w / 64); ctx.fillStyle = fill; ctx.fill(new Path2D(FOX_HEAD), 'evenodd'); ctx.fill(new Path2D(FOX_BLADE)); ctx.restore(); };
const rr = (ctx, x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const fitText = (ctx, text, x, y, maxW, font) => { ctx.font = font; const w = ctx.measureText(text).width; ctx.save(); ctx.translate(x, y); if (w > maxW) ctx.scale(maxW / w, 1); ctx.fillText(text, 0, 0); ctx.restore(); };
const decal = (canvas, x0, x1, y0, y1) => {
  const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;

};

  x.fillStyle = '#FFFFFF';
  fitText(x, 'MOBILE LORRY KEYS & DIAGNOSTICS   ·   24/7', 170, 735, 2060, '800 88px Overpass');
  x.fillStyle = YELLOW; rr(x, 420, 890, 1560, 290, 34); x.fill();
  x.strokeStyle = INK; x.lineWidth = 14; rr(x, 427, 897, 1546, 276, 30); x.stroke();
  x.fillStyle = BAND; rr(x, 434, 904, 170, 262, [26, 0, 0, 26]); x.fill();

}

{
